<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>A Short History of One Button</title>
<meta name="description" content="A one-button, eight-era interactive micro-comic.">
<style>
:root{--bg:#ded7c5;--ink:#181818;--muted:#554f46;--panel:#eee8d8;--accent:#b73528;--edge:#171717;--glow:transparent;--radius:3px;--font:Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:var(--bg);color:var(--ink);font-family:var(--font);transition:background .55s,color .55s;font-size:16px}.app{width:min(820px,100%);min-height:100svh;margin:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.kicker{font:700 .68rem/1.2 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(1.9rem,7vw,3.8rem);line-height:.94;letter-spacing:-.045em;margin:7px 0 0;font-weight:500;max-width:580px}.era{font:700 .65rem/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:9px 10px;white-space:nowrap}.stage{flex:1;min-height:430px;margin:22px 0 16px;border:2px solid var(--edge);border-radius:var(--radius);background:var(--panel);position:relative;overflow:hidden;box-shadow:7px 7px 0 var(--edge);transition:all .5s;display:grid;grid-template-rows:1fr auto}.world{position:relative;display:grid;place-items:center;min-height:330px;isolation:isolate}.world:before{content:"";position:absolute;inset:0;opacity:.38;transition:.5s;background:repeating-linear-gradient(0deg,transparent 0 22px,color-mix(in srgb,var(--ink) 14%,transparent) 22px 23px)}.object-wrap{position:relative;z-index:2;display:grid;place-items:center;width:min(270px,72vw);height:min(240px,58vw)}.machine{position:absolute;width:220px;height:172px;border:3px solid var(--edge);background:color-mix(in srgb,var(--panel) 82%,var(--ink));border-radius:var(--radius);box-shadow:inset 0 0 0 8px color-mix(in srgb,var(--panel) 75%,transparent),6px 8px 0 color-mix(in srgb,var(--edge) 80%,transparent);transition:all .45s}.machine:before,.machine:after{content:"";position:absolute;transition:.45s}.machine:before{width:55%;height:10px;left:22%;top:24px;background:var(--edge);box-shadow:0 22px 0 color-mix(in srgb,var(--edge) 55%,transparent)}.machine:after{width:24px;height:24px;border:3px solid var(--edge);right:18px;bottom:16px;border-radius:50%;background:var(--accent)}.the-button{position:relative;z-index:4;width:112px;height:112px;min-width:64px;min-height:64px;border:3px solid var(--edge);border-radius:var(--radius);background:var(--accent);color:#fff;box-shadow:0 11px 0 color-mix(in srgb,var(--accent) 58%,#000),0 15px 0 var(--edge),0 0 38px var(--glow);font:800 .74rem/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all .28s}.the-button:active,.the-button.pulse{transform:translateY(9px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 58%,#000),0 5px 0 var(--edge),0 0 45px var(--glow)}.the-button:focus-visible,.nav button:focus-visible{outline:4px solid #65d7ff;outline-offset:4px}.burst{position:absolute;z-index:3;width:10px;height:10px;border-radius:50%;background:var(--accent);pointer-events:none;animation:fly .7s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}.caption{position:relative;z-index:5;border-top:2px solid var(--edge);padding:16px 18px 18px;background:color-mix(in srgb,var(--panel) 94%,transparent);min-height:108px}.year{font:800 .68rem/1 ui-monospace,monospace;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}.line{font-size:clamp(1.08rem,3.5vw,1.45rem);line-height:1.3;margin:8px 0 0;max-width:680px}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:0 2px 12px}.tick{height:8px;padding:0;min-width:0;min-height:44px;border:0;background:transparent;position:relative;cursor:pointer}.tick:before{content:"";position:absolute;left:0;right:0;top:18px;height:6px;background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);transition:.25s}.tick.seen:before{background:color-mix(in srgb,var(--accent) 58%,transparent)}.tick.active:before{background:var(--accent);transform:scaleY(1.7)}.tick span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.nav{display:grid;grid-template-columns:52px 1fr 52px;gap:9px}.nav button{min-height:48px;border:2px solid var(--edge);border-radius:var(--radius);background:var(--panel);color:var(--ink);font:800 .76rem ui-monospace,monospace;cursor:pointer}.nav button:disabled{opacity:.28;cursor:not-allowed}.instruction{text-align:center;display:grid;place-items:center;padding:0 8px;color:var(--muted);font:600 .72rem/1.35 ui-monospace,monospace;letter-spacing:.04em}.foot{text-align:center;color:var(--muted);font:600 .62rem ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;margin-top:12px}
/* Eight visual eras */
body[data-era="0"] .machine{clip-path:polygon(12% 0,89% 5%,100% 88%,76% 100%,4% 91%,0 18%);background:#918878;border-width:0;box-shadow:inset 8px 10px 0 #aaa08d,7px 9px 0 #333}body[data-era="0"] .machine:before,body[data-era="0"] .machine:after{display:none}body[data-era="0"] .the-button{border-radius:50%;background:#713d2d;color:#eee0c8}
body[data-era="1"]{--bg:#bea773;--panel:#d8bd7d;--ink:#252016;--muted:#493716;--accent:#8f251e;--edge:#3b2d16;--radius:2px}body[data-era="1"] .world:before{background:repeating-linear-gradient(90deg,transparent 0 39px,#5c492334 39px 42px)}body[data-era="1"] .machine{border-radius:50% 50% 8px 8px;background:#9c7739;box-shadow:inset 0 0 0 8px #c69d52,7px 8px 0 #493716}body[data-era="1"] .the-button{border-radius:50%;width:94px;height:94px}
body[data-era="2"]{--bg:#9b9b92;--panel:#c6c7c0;--ink:#161816;--muted:#30342f;--accent:#861712;--edge:#242724;--radius:1px}body[data-era="2"] .machine{height:230px;width:145px;background:linear-gradient(90deg,#777,#ddd 14%,#aaa 55%,#eee 88%,#888);box-shadow:inset 0 0 0 5px #74766f,7px 8px 0 #30332f}body[data-era="2"] .machine:before{height:35px;width:64px;left:38px;top:35px;background:#232722;box-shadow:none}body[data-era="2"] .the-button{width:58px;height:58px;border-radius:50%;font-size:0}body[data-era="2"] .the-button:before{content:"▲";font-size:20px}
body[data-era="3"]{--bg:#c9c2b3;--panel:#e8e1d2;--ink:#191919;--muted:#444139;--accent:#373737;--edge:#202020;--radius:5px;--font:ui-monospace,monospace}body[data-era="3"] .machine{width:260px;height:160px;background:#c7c1b4;border-radius:10px;box-shadow:inset 0 0 0 9px #eee8dc,8px 9px 0 #555}body[data-era="3"] .the-button{width:128px;height:58px;border-radius:7px;background:#ece9e1;color:#222;box-shadow:0 7px 0 #8b887f,0 10px 0 #222}
body[data-era="4"]{--bg:#eaf0fa;--panel:#fff;--ink:#172036;--accent:#1468e8;--edge:#172036;--radius:18px;--font:system-ui,sans-serif;--glow:#1468e855}body[data-era="4"] .machine{border:0;background:#fff;width:245px;height:170px;border-radius:22px;box-shadow:0 18px 50px #6d83a044}body[data-era="4"] .machine:before{background:#dae4f3;box-shadow:0 22px 0 #edf2f8;border-radius:8px}body[data-era="4"] .machine:after{display:none}body[data-era="4"] .the-button{height:64px;width:156px;border:0;border-radius:999px;box-shadow:0 9px 22px #1468e855}
body[data-era="5"]{--bg:#100d1f;--panel:#1d1731;--ink:#f5edff;--muted:#afa3c2;--accent:#b45cff;--edge:#d8bdff;--radius:28px;--font:system-ui,sans-serif;--glow:#a044ff99}body[data-era="5"] .world:before{background:radial-gradient(circle,#b45cff44 1px,transparent 2px);background-size:22px 22px}body[data-era="5"] .machine{border:1px solid #b45cff88;background:#2c1a4866;backdrop-filter:blur(8px);border-radius:50%;width:235px;height:235px;box-shadow:0 0 70px #812ad944,inset 0 0 40px #bc67ff33}body[data-era="5"] .machine:before,body[data-era="5"] .machine:after{display:none}body[data-era="5"] .the-button{border:1px solid #e7d5ff;border-radius:50%;background:#a143f0;box-shadow:0 0 45px #b45cff}
body[data-era="6"]{--bg:#07191b;--panel:#0d292b;--ink:#d7ffef;--muted:#80b6a2;--accent:#32f5a1;--edge:#74ffc4;--radius:0;--font:ui-monospace,monospace;--glow:#32f5a199}body[data-era="6"] .world:before{background:linear-gradient(#32f5a118 1px,transparent 1px),linear-gradient(90deg,#32f5a118 1px,transparent 1px);background-size:25px 25px}body[data-era="6"] .machine{background:#0c2222aa;border:1px solid #32f5a1;border-radius:0;clip-path:polygon(8% 0,100% 0,100% 88%,92% 100%,0 100%,0 12%);box-shadow:0 0 50px #32f5a122}body[data-era="6"] .machine:before{background:#32f5a1;box-shadow:0 22px 0 #32f5a155}body[data-era="6"] .machine:after{background:#32f5a1;border-color:#0a1d1c;border-radius:0}body[data-era="6"] .the-button{background:transparent;color:#32f5a1;border:1px solid #32f5a1;box-shadow:0 0 35px #32f5a155}
body[data-era="7"]{--bg:#f6f2e8;--panel:#f6f2e8;--ink:#171713;--muted:#555149;--accent:#a83220;--edge:#171713;--radius:999px;--font:Georgia,serif;--glow:#e44f3255}body[data-era="7"] .world:before{background:radial-gradient(circle at center,#e44f3222,transparent 55%)}body[data-era="7"] .machine{border:0;background:transparent;box-shadow:none;width:270px;height:220px}body[data-era="7"] .machine:before{width:210px;height:210px;left:30px;top:5px;border:1px solid #e44f3277;border-radius:50%;background:transparent;box-shadow:inset 0 0 60px #e44f3211}body[data-era="7"] .machine:after{display:none}body[data-era="7"] .the-button{border-radius:50%;background:#f6f2e8;color:#171713;border:2px solid #171713;box-shadow:0 0 0 10px #f6f2e8,0 0 0 11px #e44f3266}
@media(max-width:520px){.app{padding-left:12px;padding-right:12px}.top{display:block}.era{display:inline-block;margin-top:13px}.stage{min-height:455px;box-shadow:5px 5px 0 var(--edge)}.caption{min-height:128px}.object-wrap{transform:scale(.92)}.timeline{grid-template-columns:repeat(4,1fr);row-gap:0}.tick{min-width:44px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-era="0">
<main class="app">
<div class="top"><div><div class="kicker">An interactive micro-comic</div><h1>A Short History of One Button</h1></div><div class="era" id="eraLabel">Era 1 of 8</div></div>
<section class="stage" aria-label="Story panel">
 <div class="world" id="world"><div class="object-wrap"><div class="machine" aria-hidden="true"></div><button class="the-button" id="mainButton" type="button">PRESS</button></div></div>
 <div class="caption" aria-live="polite"><div class="year" id="year"></div><p class="line" id="line"></p></div>
</section>
<div class="timeline" id="timeline" aria-label="Eight eras"></div>
<div class="nav"><button id="prev" type="button" aria-label="Previous era">←</button><div class="instruction" id="instruction">Press the big button to move through time</div><button id="next" type="button" aria-label="Next era">→</button></div>
<div class="foot">One action · eight eras · no branches · nothing saved</div>
</main>
<script>
(()=>{
const scenes=[
 {year:'BEFORE 10,000 BCE',text:'First it was a stone. Pressing meant weight, effort, consequence. The world moved because you did.',button:'PUSH'},
 {year:'1784 · THE FACTORY',text:'Then pressure recruited steam. One finger could wake a machine larger than a room.',button:'ENGAGE'},
 {year:'1892 · THE ELEVATOR',text:'The button learned to make a promise: choose a floor, surrender the journey, trust the mechanism.',button:'▲'},
 {year:'1984 · THE KEYBOARD',text:'It multiplied. A hundred little decisions waited under our hands, each one asking to become language.',button:'RETURN'},
 {year:'2007 · THE SCREEN',text:'It lost its depth but gained a billion disguises. Glass pretended to click. We agreed to believe it.',button:'TAP'},
 {year:'2024 · THE AIR',text:'Then even glass became optional. Say the wish aloud; the button hides somewhere inside the listening.',button:'ASK'},
 {year:'2032 · THE GUESS',text:'Soon it presses itself—one heartbeat before the request arrives. Convenience becomes prediction.',button:'ALREADY'},
 {year:'2041 · THE PAUSE',text:'At last, the cleverest button does not obey. It leaves one small space in which to ask: is this worth doing?',button:'PAUSE'}
];
const body=document.body, year=document.querySelector('#year'), line=document.querySelector('#line'), label=document.querySelector('#eraLabel'), big=document.querySelector('#mainButton'), prev=document.querySelector('#prev'), next=document.querySelector('#next'), timeline=document.querySelector('#timeline'), world=document.querySelector('#world'), instruction=document.querySelector('#instruction');
let index=0,maxSeen=0,locked=false;
scenes.forEach((_,i)=>{const b=document.createElement('button');b.className='tick';b.type='button';b.innerHTML='<span>Go to era '+(i+1)+'</span>';b.addEventListener('click',()=>show(i));timeline.append(b)});
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<10;i++){const p=document.createElement('i');p.className='burst';const a=Math.PI*2*i/10+(Math.random()-.5)*.3,d=55+Math.random()*75;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');p.style.left='calc(50% - 5px)';p.style.top='calc(50% - 5px)';world.append(p);setTimeout(()=>p.remove(),750)}}
function show(n,pressed=false){index=Math.max(0,Math.min(scenes.length-1,n));maxSeen=Math.max(maxSeen,index);body.dataset.era=index;const s=scenes[index];year.textContent=s.year;line.textContent=s.text;big.textContent=s.button;label.textContent='Era '+(index+1)+' of '+scenes.length;prev.disabled=index===0;next.disabled=index===scenes.length-1;[...timeline.children].forEach((t,i)=>{t.classList.toggle('active',i===index);t.classList.toggle('seen',i<=maxSeen)});instruction.textContent=index===scenes.length-1?'You reached the pause. Use ← to revisit.':'Press the big button to move through time';if(pressed){big.classList.add('pulse');setTimeout(()=>big.classList.remove('pulse'),180)}}
function advance(){if(locked)return;locked=true;burst();if(index<scenes.length-1)setTimeout(()=>show(index+1,true),170);else{big.classList.add('pulse');setTimeout(()=>big.classList.remove('pulse'),220)}setTimeout(()=>locked=false,330)}
big.addEventListener('click',advance);next.addEventListener('click',()=>show(index+1));prev.addEventListener('click',()=>show(index-1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1);if((e.key===' '||e.key==='Enter')&&e.target===body){e.preventDefault();advance()}});show(0);
})();
</script>
</body></html>
