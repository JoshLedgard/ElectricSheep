<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>Pocket Signal Cartographer</title>
<style>
  :root {
    --bg: #0a0f1a;
    --panel: #111a28;
    --panel-2: #0d1421;
    --ink: #cfe3f2;
    --ink-dim: #6f8ba0;
    --line: rgba(120,170,210,0.16);
    --q-useful: #19b9c9;   /* top  */
    --q-playful: #e06bb0;  /* bottom */
    --now: #ffce5c;        /* left */
    --later: #8a9bff;      /* right */
    --route: #6ff0c8;
    --chip: #16233a;
    --chip-edge: rgba(120,170,210,0.28);
    --tap: 46px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    background:
      radial-gradient(ellipse 90% 50% at 50% -8%, rgba(30,120,160,0.14), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding: 18px 14px calc(34px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
  }
  header { text-align: center; margin-bottom: 14px; }
  .kicker {
    font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 7px;
  }
  h1 {
    font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 750; letter-spacing: -0.02em;
    color: #eaf4fc; line-height: 1.1;
  }
  h1 .a { color: var(--q-useful); }
  h1 .b { color: var(--q-playful); }
  .instr {
    font-size: 12.5px; color: var(--ink-dim); margin-top: 8px; max-width: 34ch;
    margin-left: auto; margin-right: auto;
  }

  /* ---- MAP ---- */
  .map-wrap { position: relative; margin: 16px 0 10px; }
  .map {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45);
    overflow: hidden;
    touch-action: none;
  }
  .map.drop-live { border-color: rgba(111,240,200,0.5); box-shadow: inset 0 0 0 1px rgba(111,240,200,0.4), inset 0 0 60px rgba(0,0,0,0.45); }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* axis edge labels */
  .axis { position: absolute; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; pointer-events: none; }
  .axis-top    { top: 8px; left: 50%; transform: translateX(-50%); color: var(--q-useful); }
  .axis-bottom { bottom: 8px; left: 50%; transform: translateX(-50%); color: var(--q-playful); }
  .axis-left   { left: 9px; top: 50%; transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; color: var(--now); }
  .axis-right  { right: 9px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; color: var(--later); }

  /* placed signal dot */
  .placed {
    position: absolute; transform: translate(-50%, -50%);
    min-width: var(--tap); min-height: 30px;
    display: flex; align-items: center; gap: 5px;
    padding: 5px 9px 5px 6px;
    background: var(--chip); border: 1px solid var(--chip-edge);
    border-radius: 999px; font-size: 11.5px; font-weight: 600; color: var(--ink);
    box-shadow: 0 4px 14px rgba(0,0,0,0.45); cursor: grab;
    touch-action: none; white-space: nowrap; z-index: 4;
    transition: box-shadow .15s;
  }
  .placed .blob { width: 13px; height: 13px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  .placed.grabbing { cursor: grabbing; box-shadow: 0 0 0 2px var(--route), 0 6px 18px rgba(0,0,0,0.5); z-index: 9; }
  .placed .seq {
    position: absolute; top: -8px; left: -8px; width: 19px; height: 19px;
    background: var(--route); color: #06231b; font-size: 10.5px; font-weight: 800;
    border-radius: 50%; display: none; align-items: center; justify-content: center;
    box-shadow: 0 0 8px rgba(111,240,200,0.7);
  }
  .map.routed .placed .seq { display: flex; }

  /* ---- TRAY ---- */
  .tray-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 8px; }
  .tray-head h2 { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); font-weight: 700; }
  .tray-head .cnt { font-size: 11.5px; color: var(--ink-dim); }
  .tray {
    display: flex; flex-wrap: wrap; gap: 8px;
    min-height: 54px; padding: 10px; border-radius: 14px;
    background: var(--panel); border: 1px dashed var(--line);
  }
  .tray.empty::before {
    content: 'All signals placed — draw the route ↓';
    color: var(--ink-dim); font-size: 12px; font-style: italic; margin: auto;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: var(--tap); padding: 8px 13px 8px 10px;
    background: var(--chip); border: 1px solid var(--chip-edge);
    border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink);
    cursor: grab; touch-action: none; white-space: nowrap;
    transition: transform .12s, border-color .12s;
  }
  .chip:active { transform: scale(0.97); }
  .chip .blob { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 7px currentColor; }

  /* dragging clone */
  #ghost {
    position: fixed; z-index: 999; pointer-events: none; left: 0; top: 0;
    opacity: 0; transform: translate(-50%,-50%) scale(1.05);
    box-shadow: 0 8px 24px rgba(0,0,0,0.55) !important;
  }
  #ghost.on { opacity: 1; }

  /* ---- CONTROLS ---- */
  .controls { display: flex; gap: 9px; margin: 14px 0 4px; }
  button {
    flex: 1; min-height: var(--tap); border-radius: 12px; cursor: pointer;
    font-size: 13.5px; font-weight: 700; font-family: inherit; letter-spacing: 0.01em;
    border: 1px solid var(--chip-edge); background: var(--panel); color: var(--ink);
    transition: transform .1s, background .15s, opacity .15s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: linear-gradient(135deg, #16c0b0, #1aa0d8); color: #03161a; border: none; }
  button.primary:disabled { background: #1a2a3a; color: var(--ink-dim); }

  /* ---- RESULT ---- */
  .result {
    margin-top: 14px; padding: 15px 16px; border-radius: 16px;
    background: linear-gradient(160deg, rgba(111,240,200,0.08), rgba(20,30,46,0.6));
    border: 1px solid rgba(111,240,200,0.22);
    opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s;
    min-height: 0; overflow: hidden;
  }
  .result.show { opacity: 1; transform: none; }
  .result h3 { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--route); margin-bottom: 9px; font-weight: 800; }
  .result .lead { font-size: 14.5px; color: #eaf4fc; font-weight: 600; margin-bottom: 6px; }
  .result .lead b { color: var(--route); }
  .result .sub { font-size: 12.5px; color: var(--ink-dim); }
  .result .sub b { color: var(--ink); font-weight: 600; }
  .legendline { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 11px; font-size: 11px; color: var(--ink-dim); }
  .legendline span { display: inline-flex; align-items: center; gap: 5px; }
  .legendline i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  footer { text-align: center; margin-top: 22px; font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<header>
  <div class="kicker">Daily Surprise · Pocket</div>
  <h1><span class="a">Signal</span> <span class="b">Cartographer</span></h1>
  <p class="instr">Drag each signal onto the map — place it by how <b>Useful↔Playful</b> and <b>Now↔Later</b> it feels. Then draw the route.</p>
</header>

<div class="map-wrap">
  <div class="map" id="map" aria-label="Signal map. Top is Useful, bottom is Playful, left is Now, right is Later.">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <!-- quadrant tints -->
      <rect x="0" y="0" width="50" height="50" fill="#19b9c9" opacity="0.07"/>
      <rect x="50" y="0" width="50" height="50" fill="#8a9bff" opacity="0.06"/>
      <rect x="0" y="50" width="50" height="50" fill="#ffce5c" opacity="0.05"/>
      <rect x="50" y="50" width="50" height="50" fill="#e06bb0" opacity="0.06"/>
      <!-- grid -->
      <line x1="50" y1="2" x2="50" y2="98" stroke="rgba(150,185,215,0.22)" stroke-width="0.4"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="rgba(150,185,215,0.22)" stroke-width="0.4"/>
      <line x1="25" y1="3" x2="25" y2="97" stroke="rgba(150,185,215,0.07)" stroke-width="0.3"/>
      <line x1="75" y1="3" x2="75" y2="97" stroke="rgba(150,185,215,0.07)" stroke-width="0.3"/>
      <line x1="3" y1="25" x2="97" y2="25" stroke="rgba(150,185,215,0.07)" stroke-width="0.3"/>
      <line x1="3" y1="75" x2="97" y2="75" stroke="rgba(150,185,215,0.07)" stroke-width="0.3"/>
      <!-- route -->
      <path id="route" d="" fill="none" stroke="#6ff0c8" stroke-width="0.9"
            stroke-linecap="round" stroke-linejoin="round"
            style="filter: drop-shadow(0 0 2px rgba(111,240,200,0.6));"/>
    </svg>
    <div class="axis axis-top">Useful</div>
    <div class="axis axis-bottom">Playful</div>
    <div class="axis axis-left">Now</div>
    <div class="axis axis-right">Later</div>
  </div>
</div>

<div class="tray-head">
  <h2>Signals</h2>
  <span class="cnt" id="cnt"></span>
</div>
<div class="tray" id="tray"></div>

<div class="controls">
  <button id="shuffle">↻ Shuffle</button>
  <button id="draw" class="primary" disabled>Draw route</button>
  <button id="reset">Reset</button>
</div>

<div class="result" id="result" aria-live="polite"></div>

<footer>Self-contained · runs offline · nothing leaves your device</footer>

<div id="ghost" class="placed"></div>

<script>
(function(){
  "use strict";

  // ---- signal pool (generic, thematic, no private specifics) ----
  var POOL = [
    "Fix the flaky test",
    "Sketch a wild idea",
    "Reply to the thread",
    "Tidy the inbox",
    "Prototype a demo",
    "Read the long doc",
    "Sun + a walk",
    "Refactor that mess",
    "Ship the small fix",
    "Doodle a concept",
    "Plan next week",
    "Try the new tool",
    "Write the update",
    "Clear the backlog",
    "Play with a sound"
  ];
  var PALETTE = ["#19b9c9","#e06bb0","#ffce5c","#8a9bff","#6ff0c8","#ff9a6b","#9be36b"];
  var SET_SIZE = 6;

  var map = document.getElementById('map');
  var tray = document.getElementById('tray');
  var ghost = document.getElementById('ghost');
  var routePath = document.getElementById('route');
  var result = document.getElementById('result');
  var cntEl = document.getElementById('cnt');
  var drawBtn = document.getElementById('draw');

  var signals = []; // {id,label,color, placed, x,y, el}
  var nextId = 0;

  function rand(n){ return Math.floor(Math.random()*n); }
  function pickSet(){
    var idx = POOL.map(function(_,i){return i;});
    for (var i=idx.length-1;i>0;i--){ var j=rand(i+1); var t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    return idx.slice(0, SET_SIZE).map(function(k,i){
      return { id: nextId++, label: POOL[k], color: PALETTE[i % PALETTE.length], placed:false, x:0, y:0, el:null };
    });
  }

  function makeChip(s){
    var c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = '<span class="blob" style="color:'+s.color+';background:'+s.color+'"></span>'+escapeHtml(s.label);
    c.setAttribute('role','button');
    c.setAttribute('tabindex','0');
    bindDrag(c, s, false);
    return c;
  }

  function makePlaced(s){
    var p = document.createElement('div');
    p.className = 'placed';
    p.innerHTML = '<span class="seq"></span><span class="blob" style="color:'+s.color+';background:'+s.color+'"></span>'+escapeHtml(s.label);
    bindDrag(p, s, true);
    return p;
  }

  function escapeHtml(t){ return t.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render(){
    // tray
    tray.innerHTML = '';
    var unplaced = signals.filter(function(s){return !s.placed;});
    unplaced.forEach(function(s){ var c = makeChip(s); s.el = c; tray.appendChild(c); });
    tray.classList.toggle('empty', unplaced.length === 0);

    // placed
    signals.filter(function(s){return s.placed;}).forEach(function(s){
      if (!s.el || !s.el.classList.contains('placed')) { s.el = makePlaced(s); map.appendChild(s.el); }
      positionPlaced(s);
    });
    cntEl.textContent = (signals.length - unplaced.length) + ' / ' + signals.length + ' placed';
    var anyPlaced = signals.some(function(s){return s.placed;});
    drawBtn.disabled = !anyPlaced;
    clearRoute();
  }

  function positionPlaced(s){
    if (!s.el) return;
    s.el.style.left = (s.x*100) + '%';
    s.el.style.top  = (s.y*100) + '%';
  }

  function clearRoute(){
    routePath.setAttribute('d','');
    map.classList.remove('routed');
    result.classList.remove('show');
    var seqs = map.querySelectorAll('.seq'); seqs.forEach(function(q){q.textContent='';});
  }

  // ---------- drag handling (pointer events, mouse + touch) ----------
  var drag = null;
  function bindDrag(el, s, fromMap){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch(_){}
      drag = { s:s, el:el, fromMap:fromMap, moved:false, pid:e.pointerId };
      ghost.innerHTML = '<span class="blob" style="color:'+s.color+';background:'+s.color+'"></span>'+escapeHtml(s.label);
      moveGhost(e.clientX, e.clientY);
      if (fromMap) el.classList.add('grabbing');
    });
    // keyboard: place unplaced into center / remove placed
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (s.placed) { s.placed = false; s.el && s.el.remove(); s.el=null; render(); }
        else { s.placed = true; s.x = 0.5; s.y = 0.5; s.el && s.el.remove(); s.el = makePlaced(s); map.appendChild(s.el); positionPlaced(s); afterChange(); }
      }
    });
  }

  function moveGhost(x,y){ ghost.style.left = x+'px'; ghost.style.top = y+'px'; }

  document.addEventListener('pointermove', function(e){
    if (!drag) return;
    if (!drag.moved) {
      drag.moved = true; ghost.classList.add('on'); // start ghost on first move
    }
    moveGhost(e.clientX, e.clientY);
    var over = isOverMap(e.clientX, e.clientY);
    map.classList.toggle('drop-live', over);
  }, {passive:false});

  document.addEventListener('pointerup', function(e){
    if (!drag) return;
    var s = drag.s;
    ghost.classList.remove('on');
    map.classList.remove('drop-live');
    if (drag.el) drag.el.classList.remove('grabbing');

    var r = map.getBoundingClientRect();
    var inside = isOverMap(e.clientX, e.clientY);
    if (!drag.moved) {
      // tap (no drag): placed chip -> back to tray; tray chip -> place near center
      if (drag.fromMap) { s.placed=false; if(s.el){s.el.remove();} s.el=null; render(); }
      else {
        s.placed = true;
        s.x = 0.46 + Math.min(0.08, signals.filter(function(q){return q.placed;}).length*0.015);
        s.y = 0.5;
        if (s.el) s.el.remove(); s.el = makePlaced(s); map.appendChild(s.el);
        positionPlaced(s); afterChange();
      }
      drag = null; return;
    }
    if (inside) {
      var nx = (e.clientX - r.left) / r.width;
      var ny = (e.clientY - r.top) / r.height;
      nx = Math.max(0.06, Math.min(0.94, nx));
      ny = Math.max(0.06, Math.min(0.94, ny));
      s.x = nx; s.y = ny;
      if (!s.placed) { s.placed = true; if (s.el) s.el.remove(); s.el = makePlaced(s); map.appendChild(s.el); }
      positionPlaced(s);
      afterChange();
    } else {
      // dropped outside -> return to tray
      if (s.placed) { s.placed = false; if (s.el) s.el.remove(); s.el = null; }
      render();
    }
    drag = null;
  });

  function isOverMap(x,y){
    var r = map.getBoundingClientRect();
    return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
  }

  function afterChange(){
    var unplaced = signals.filter(function(s){return !s.placed;}).length;
    cntEl.textContent = (signals.length - unplaced) + ' / ' + signals.length + ' placed';
    tray.classList.toggle('empty', unplaced === 0);
    drawBtn.disabled = !signals.some(function(s){return s.placed;});
    clearRoute();
  }

  // ---------- route + recommendation ----------
  // Order: a tour that starts in the Now+Useful corner and sweeps outward.
  // priority score: low = do first (close to Now & Useful => small x, small y).
  function drawRoute(){
    var placed = signals.filter(function(s){return s.placed;});
    if (placed.length === 0) return;

    placed.forEach(function(s){ s.score = s.x*1.15 + s.y*0.85; }); // Now weighted a touch more
    placed.sort(function(a,b){ return a.score - b.score; });

    // build polyline in map % coordinates
    var pts = placed.map(function(s){ return [s.x*100, s.y*100]; });
    var d = 'M ' + pts.map(function(p){return p[0].toFixed(2)+' '+p[1].toFixed(2);}).join(' L ');
    routePath.setAttribute('d', d);

    // animate stroke draw-on
    var len = routePath.getTotalLength();
    routePath.style.transition = 'none';
    routePath.style.strokeDasharray = len;
    routePath.style.strokeDashoffset = len;
    // force reflow
    routePath.getBoundingClientRect();
    routePath.style.transition = 'stroke-dashoffset 1.05s ease';
    routePath.style.strokeDashoffset = '0';

    // numbered sequence badges
    map.classList.add('routed');
    placed.forEach(function(s,i){
      var seq = s.el.querySelector('.seq');
      if (seq) seq.textContent = (i+1);
    });

    showResult(placed);
  }

  function quadrant(s){
    var lr = s.x < 0.5 ? 'Now' : 'Later';
    var ud = s.y < 0.5 ? 'Useful' : 'Playful';
    return ud + ' · ' + lr;
  }

  function showResult(ordered){
    var first = ordered[0];
    var last  = ordered[ordered.length-1];

    // find the most-playful-and-later signal to "park"
    var park = ordered.slice().sort(function(a,b){ return (b.x+b.y) - (a.x+a.y); })[0];
    // count quadrants
    var nowCount = ordered.filter(function(s){return s.x<0.5;}).length;
    var usefulCount = ordered.filter(function(s){return s.y<0.5;}).length;

    var mood;
    if (nowCount >= ordered.length*0.6 && usefulCount >= ordered.length*0.6)
      mood = "A focused, do-it-now map. Front-load and clear it.";
    else if (usefulCount <= ordered.length*0.4)
      mood = "A playful map — leave room to wander between the useful bits.";
    else if (nowCount <= ordered.length*0.4)
      mood = "A patient map. Little is truly urgent; pace yourself.";
    else
      mood = "A balanced map — alternate one useful pass with one playful break.";

    var html = '';
    html += '<h3>Your route</h3>';
    html += '<div class="lead">Start with <b>'+escapeHtml(first.label)+'</b>'+
            (ordered.length>1 ? ' → end on <b>'+escapeHtml(last.label)+'</b>.' : '.')+'</div>';
    html += '<div class="sub">'+mood+'</div>';
    if (ordered.length > 2 && park && park.id !== first.id) {
      html += '<div class="sub" style="margin-top:6px;">Park for later: <b>'+escapeHtml(park.label)+'</b> ('+quadrant(park)+').</div>';
    }
    html += '<div class="legendline">'+
            '<span><i style="background:#19b9c9"></i>Useful</span>'+
            '<span><i style="background:#e06bb0"></i>Playful</span>'+
            '<span><i style="background:#ffce5c"></i>Now</span>'+
            '<span><i style="background:#8a9bff"></i>Later</span></div>';
    result.innerHTML = html;
    result.classList.add('show');
    result.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  // ---------- controls ----------
  document.getElementById('draw').addEventListener('click', drawRoute);
  document.getElementById('shuffle').addEventListener('click', function(){
    // remove placed nodes from map
    signals.forEach(function(s){ if (s.el && s.el.parentNode===map) s.el.remove(); });
    signals = pickSet();
    render();
  });
  document.getElementById('reset').addEventListener('click', function(){
    signals.forEach(function(s){
      if (s.el && s.el.parentNode===map) s.el.remove();
      s.placed = false; s.el = null;
    });
    render();
  });

  // ---------- init ----------
  signals = pickSet();
  render();
})();
</script>
</body>
</html>
