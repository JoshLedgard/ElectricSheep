<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Field Guide to Tiny Bets</title>
<meta name="description" content="A tap-through pocket comic about spotting tiny useful bets in the morning fog.">
<style>
:root{--bg:#071018;--ink:#dff3ee;--muted:#8ab0a9;--panel:#10212a;--line:#254854;--a:#7cf6c3;--b:#ffd36b;--c:#ff7bac;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#173849 0,#071018 48rem);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow-x:hidden} body{padding:18px 14px 34px}.app{max-width:520px;margin:0 auto}header{text-align:center;margin:6px 0 14px}.kicker{text-transform:uppercase;letter-spacing:.22em;color:var(--muted);font-size:11px}h1{margin:6px 0 6px;font-size:clamp(29px,8vw,44px);line-height:.96;letter-spacing:-.05em}.sub{margin:0 auto;color:var(--muted);font-size:15px;max-width:34em}.book{background:linear-gradient(180deg,#10212a,#0c1922);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 20px 60px var(--shadow)}.spread{display:grid;grid-template-columns:1fr;gap:12px}.panel{position:relative;min-height:168px;border:2px solid #325d68;background:#f6eecf;color:#18313a;border-radius:18px;padding:14px;overflow:hidden;box-shadow:inset 0 -8px 0 rgba(0,0,0,.05)}.panel.dark{background:#15313b;color:#e8fff8}.panel.sky{background:linear-gradient(#bfefff,#fff1b7)}.panel.mint{background:#d9ffe9}.caption{font-weight:800;font-size:18px;line-height:1.15;max-width:75%;position:relative;z-index:2}.tiny{font-size:13px;line-height:1.35;margin-top:8px;max-width:78%;position:relative;z-index:2}.art{position:absolute;inset:auto 8px 6px auto;font-size:74px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.08));user-select:none}.bug{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--a);right:30px;bottom:30px;box-shadow:-18px -10px 0 #ffd36b,16px -15px 0 #ff7bac}.bug:after{content:"";position:absolute;left:17px;top:38px;width:32px;height:3px;background:#18313a;transform:rotate(28deg);box-shadow:0 -9px 0 #18313a}.trail{position:absolute;left:12px;right:12px;bottom:22px;height:52px;background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(24,49,58,.22) 27px 30px);border-bottom:4px dotted rgba(24,49,58,.5);border-radius:50%}.moon{position:absolute;right:28px;top:20px;width:62px;height:62px;border-radius:50%;background:#ffd36b;box-shadow:0 0 0 14px rgba(255,211,107,.13)}.shelves{position:absolute;right:12px;bottom:18px;width:130px;height:92px;background:linear-gradient(#254854 0 8px,transparent 8px 28px,#254854 28px 36px,transparent 36px 56px,#254854 56px 64px,transparent 64px);opacity:.8}.cardlet{position:absolute;right:36px;bottom:44px;width:74px;height:48px;background:white;color:#18313a;border:2px solid #18313a;border-radius:8px;transform:rotate(-7deg);display:grid;place-items:center;font-weight:900}.choicebar{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0 2px}.choice{min-height:48px;border:1px solid var(--line);border-radius:14px;background:#132b35;color:var(--ink);font-size:15px;font-weight:800;padding:12px;text-align:left}.choice[aria-pressed="true"]{border-color:var(--a);box-shadow:0 0 0 3px rgba(124,246,195,.16);background:#183b43}.nav{display:flex;gap:10px;margin-top:12px}.nav button{min-height:48px;border:0;border-radius:14px;font-weight:900;font-size:15px;padding:0 15px}.nav .secondary{background:#1a3039;color:var(--ink);border:1px solid var(--line)}.nav .primary{flex:1;background:linear-gradient(135deg,var(--a),var(--b));color:#082029}.progress{display:flex;justify-content:center;gap:6px;margin:12px 0}.dot{width:10px;height:10px;border-radius:50%;background:#254854}.dot.on{background:var(--a);box-shadow:0 0 12px var(--a)}.ending{display:none;margin-top:12px;background:#0c1922;border:1px solid var(--line);border-radius:18px;padding:14px}.ending.show{display:block}label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#08131a;color:var(--ink);font-size:16px;padding:12px}.note{margin-top:10px;color:var(--muted);font-size:13px}.saved{color:var(--a);font-weight:800}@media(min-width:520px){.spread{grid-template-columns:1fr 1fr}.panel.hero{grid-column:1/3}.choicebar{grid-template-columns:1fr 1fr}}</style>
</head>
<body><main class="app"><header><div class="kicker">Daily Surprise • July 5</div><h1>Pocket Field Guide<br>to Tiny Bets</h1><p class="sub">A tap-through mini comic for spotting one small useful move in the morning fog.</p></header><section class="book" aria-live="polite"><div class="progress" id="progress"></div><div class="spread" id="spread"></div><div class="choicebar" id="choices"></div><div class="nav"><button class="secondary" id="back">Back</button><button class="primary" id="next">Open the next panel</button></div><section class="ending" id="ending"><label for="bet">Name one tiny bet worth trying today</label><input id="bet" maxlength="80" placeholder="e.g. make the first rough sketch"><div class="note" id="saved">Stored only in this browser.</div></section></section></main><script>
const pages=[{panels:[['hero sky','The morning field is full of almost-ideas.','Most are too large to carry before coffee.','🌤️'],['mint','A tiny bet is smaller than a plan.','It has a door, a handle, and a way back out.','🚪']],choices:['Follow the glimmer','Look under the ordinary']},{panels:[['dark','Field mark #1: it makes the next step visible.','Not the whole map. Just the next stone.','🪨'],['','Field mark #2: it can be tested kindly.','No grand launch. No scoreboard. Just a nudge.','🧪']],choices:['Keep it playful','Keep it practical']},{panels:[['mint','If it grows teeth, shrink it.','“Write the strategy” becomes “name three possible openings.”','✂️'],['sky','If it turns foggy, draw it.','A box, an arrow, a silly bug with a lantern.','🐞']],choices:['Pocket the lantern','Pocket the scissors']},{panels:[['dark','Field mark #3: it leaves a trace.','A note, a sketch, a question you can return to.','🗒️'],['hero','Today’s specimen: one small move with a clean edge.','Give it a name and let it be enough.','✨']],choices:['Name the tiny bet']}];let page=0, picked=[];const spread=document.getElementById('spread'),choices=document.getElementById('choices'),progress=document.getElementById('progress'),ending=document.getElementById('ending'),bet=document.getElementById('bet'),saved=document.getElementById('saved');function draw(){progress.innerHTML=pages.map((_,i)=>`<span class="dot ${i===page?'on':''}"></span>`).join('');spread.innerHTML=pages[page].panels.map(p=>`<article class="panel ${p[0]}"><div class="caption">${p[1]}</div><div class="tiny">${p[2]}</div><div class="art">${p[3]}</div>${page===0?'<div class="trail"></div>':''}${page===1?'<div class="moon"></div>':''}${page===2?'<div class="bug"></div>':''}${page===3?'<div class="shelves"></div><div class="cardlet">tiny</div>':''}</article>`).join('');choices.innerHTML=pages[page].choices.map((c,i)=>`<button class="choice" aria-pressed="${picked[page]===i}" data-i="${i}">${c}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{picked[page]=+b.dataset.i;draw()});document.getElementById('back').disabled=page===0;document.getElementById('next').textContent=page===pages.length-1?'Write the field note':'Open the next panel';ending.classList.toggle('show',page===pages.length-1)}document.getElementById('back').onclick=()=>{if(page>0){page--;draw()}};document.getElementById('next').onclick=()=>{if(page<pages.length-1){page++;draw()}else{bet.focus()}};bet.value=localStorage.getItem('tiny-bet-field-note')||'';bet.oninput=()=>{localStorage.setItem('tiny-bet-field-note',bet.value);saved.innerHTML=bet.value?'Saved locally: <span class="saved">field note pocketed</span>':'Stored only in this browser.'};draw();
</script></body></html>
