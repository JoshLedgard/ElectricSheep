<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shadow Desk</title><style>
:root{color-scheme:dark;font-family:ui-rounded,system-ui,-apple-system,sans-serif;background:#101620;color:#f3eee1}*{box-sizing:border-box}body{margin:0;min-width:0;background:radial-gradient(ellipse at 50% -20%,#36415b,#101620 65%);min-height:100vh}main{max-width:780px;margin:auto;padding:20px 15px 42px}header{display:flex;align-items:center;gap:14px;margin-bottom:15px}.mark{background:#f6cb74;color:#342e35;width:47px;height:47px;display:grid;place-items:center;border-radius:14px;font-size:25px;box-shadow:0 7px 25px #f6cb7433}h1{font-size:clamp(27px,6vw,39px);letter-spacing:-.05em;line-height:1;margin:0}p{margin:7px 0 0;color:#bbc5d5;line-height:1.45;font-size:15px}.frame{background:#e8dfca;padding:9px;border-radius:22px;box-shadow:0 24px 65px #0008,0 0 0 1px #fff4}.stage{display:block;width:100%;aspect-ratio:1.12;border-radius:15px;background:#e6d9bb;touch-action:none;cursor:grab}.stage:active{cursor:grabbing}.hint{color:#b6bfd0;font-size:14px;margin:15px 4px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button{border:1px solid #697284;background:#293344;color:#f4ecdb;border-radius:12px;min-height:46px;padding:0 17px;font:600 14px system-ui;cursor:pointer}button:hover{background:#374357}button:focus-visible,input:focus-visible{outline:3px solid #f6cb74;outline-offset:2px}.primary{background:#f3c779;color:#282b36;border-color:#f3c779}.primary:hover{background:#ffdda1}.slider{display:flex;align-items:center;gap:10px;flex:1 1 180px;min-height:46px;padding:0 4px;color:#e9e4d7;font-size:14px}input[type=range]{width:100%;accent-color:#f3c779;min-height:44px}footer{color:#8795a8;font-size:12px;margin-top:25px}#announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><main><header><div class="mark" aria-hidden="true">✦</div><div><h1>Shadow Desk</h1><p>A little light, a few paper shapes, an entire stage.</p></div></header><div class="frame"><canvas id="stage" class="stage" aria-label="Interactive shadow stage. Drag the golden lamp or a paper shape to change the shadows."></canvas></div><p class="hint">Drag the golden lamp or a paper shape. Move the light close for bigger shadows; adjust softness below.</p><div class="controls"><button id="add">Add cutout</button><button id="reset">Reset scene</button><label class="slider">Softness <input id="soft" type="range" min="0" max="24" value="9" aria-label="Shadow softness"></label><button class="primary" id="save">Save PNG</button></div><div id="announcement" role="status" aria-live="polite"></div><footer>Made for curious hands. Runs entirely in this browser; no uploads or storage.</footer></main><script>
(()=>{'use strict';const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');const W=720,H=640;let lamp,shapes,selected=null,delta={x:0,y:0},soft=9,seq=0;const types=['star','leaf','house','moon','diamond'];const colors=['#d46a59','#609b8c','#7382bb','#dcaa55','#a786ba'];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){lamp={x:155,y:135};shapes=[{x:380,y:260,type:0,r:38},{x:520,y:395,type:1,r:43},{x:270,y:448,type:2,r:39}];seq=3;paint();}
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);paint();}function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function shapePath(type){let p=new Path2D();if(type===0){for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?0.45:1,x=Math.cos(a)*r,y=Math.sin(a)*r;i?p.lineTo(x,y):p.moveTo(x,y)}p.closePath()}else if(type===1){p.moveTo(0,-1);p.bezierCurveTo(1.25,-.8,1.15,.6,0,1);p.bezierCurveTo(-1.2,.4,-1.1,-.65,0,-1);p.closePath()}else if(type===2){p.moveTo(-1,-.05);p.lineTo(0,-1);p.lineTo(1,-.05);p.lineTo(.8,-.05);p.lineTo(.8,1);p.lineTo(-.8,1);p.lineTo(-.8,-.05);p.closePath()}else if(type===3){p.arc(0,0,1,Math.PI*.28,Math.PI*1.72,false);p.bezierCurveTo(-.15,-.4,-.15,.4,Math.cos(Math.PI*.28),Math.sin(Math.PI*.28));p.closePath()}else{p.moveTo(0,-1);p.lineTo(1,0);p.lineTo(0,1);p.lineTo(-1,0);p.closePath()}return p;}
function drawShape(s,x,y,r,color){ctx.save();ctx.translate(x,y);ctx.scale(r,r);ctx.fillStyle=color;ctx.fill(shapePath(s.type));ctx.restore()}
function paint(){if(!canvas.width)return;ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#f0e8d3');bg.addColorStop(1,'#dbccab');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.strokeStyle='#917e6730';ctx.lineWidth=1;for(let x=40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();let glow=ctx.createRadialGradient(lamp.x,lamp.y,3,lamp.x,lamp.y,570);glow.addColorStop(0,'#fff8dbaa');glow.addColorStop(.5,'#ffefc535');glow.addColorStop(1,'#ffe6aa00');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
for(let s of shapes){let dx=s.x-lamp.x,dy=s.y-lamp.y,dist=Math.hypot(dx,dy),scale=clamp(1.65-dist/850,1.05,1.6),offset=clamp(48+dist*.13,48,125);let x=s.x+(dx/(dist||1))*offset,y=s.y+(dy/(dist||1))*offset;ctx.save();ctx.filter=`blur(${soft}px)`;ctx.globalAlpha=.52;drawShape(s,x,y,s.r*scale,'#1b2634');ctx.restore();}
for(let s of shapes){ctx.save();ctx.shadowColor='#1d1c2480';ctx.shadowBlur=9;ctx.shadowOffsetY=5;drawShape(s,s.x,s.y,s.r,colors[s.type]);ctx.restore();ctx.save();ctx.translate(s.x,s.y);ctx.rotate(-.5);ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s.r*.3,-s.r*.4);ctx.lineTo(s.r*.2,-s.r*.7);ctx.stroke();ctx.restore();}
ctx.save();ctx.shadowColor='#f4ae4e';ctx.shadowBlur=35;ctx.fillStyle='#f9d083';ctx.beginPath();ctx.arc(lamp.x,lamp.y,27,0,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='#9e663e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(lamp.x,lamp.y,26,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff6d6';ctx.beginPath();ctx.arc(lamp.x,lamp.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#705c4c';ctx.font='600 14px system-ui';ctx.fillText('LIGHT',clamp(lamp.x-22,8,W-55),clamp(lamp.y+48,20,H-8));}
canvas.addEventListener('pointerdown',e=>{let p=pos(e);if(Math.hypot(p.x-lamp.x,p.y-lamp.y)<45)selected=lamp;else{selected=[...shapes].reverse().find(s=>Math.hypot(p.x-s.x,p.y-s.y)<s.r+15)}if(!selected)return;delta={x:p.x-selected.x,y:p.y-selected.y};canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!selected)return;let p=pos(e);selected.x=clamp(p.x-delta.x,35,W-35);selected.y=clamp(p.y-delta.y,35,H-35);paint()});function end(){selected=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
document.getElementById('soft').addEventListener('input',e=>{soft=+e.target.value;paint()});document.getElementById('add').addEventListener('click',()=>{let t=seq++%types.length;shapes.push({x:clamp(255+(seq*83)%380,60,W-60),y:clamp(180+(seq*97)%340,60,H-60),type:t,r:35+seq%3*5});if(shapes.length>12)shapes.shift();paint();document.getElementById('announcement').textContent=`Added ${types[t]} cutout`});document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Reset the whole scene?'))return;reset();document.getElementById('announcement').textContent='Scene reset'});document.getElementById('save').addEventListener('click',()=>{const a=document.createElement('a');a.download='shadow-desk.png';a.href=canvas.toDataURL('image/png');a.click();document.getElementById('announcement').textContent='PNG saved'});window.addEventListener('resize',resize);reset();resize();})();
</script></body></html>
